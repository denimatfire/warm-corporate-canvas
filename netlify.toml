[build]
  publish = "dist"
  command = "npm run build"

# Serve static article pages with proper meta tags
[[redirects]]
  from = "/article/how-i-cracked-the-gate-exam-in-just-45-days-a-bold-strategy"
  to = "/article/how-i-cracked-the-gate-exam-in-just-45-days-a-bold-strategy.html"
  status = 200

# Add more article redirects here as needed
# [[redirects]]
#   from = "/article/your-next-article-slug"
#   to = "/article/your-next-article-slug.html"
#   status = 200

# Fallback to SPA for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"