[build]
  publish = "dist"
  command = "npm run build"

# Prerender pages for social media crawlers
[[plugins]]
  package = "@netlify/plugin-gatsby"

# Serve static article pages for social media crawlers
[[redirects]]
  from = "/article/*"
  to = "/article/:splat.html"
  status = 200
  conditions = {User-Agent = ["facebookexternalhit*", "Twitterbot*", "LinkedInBot*", "WhatsApp*", "TelegramBot*"]}

# Fallback to SPA for regular users
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"